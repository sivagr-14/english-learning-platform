services:
  postgres:
    image: postgres:15-alpine
    container_name: english_learning_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: english_learning
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: english_learning_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: english_learning_backend
    ports:
      - "5001:5000"
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/english_learning}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5000}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Do not bind-mount source in the container for compose-managed dev images,
    # so the image-installed dependencies are available inside the container.
    # For local development you can run the app with a local dev server instead.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: npm run dev

  worker:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: english_learning_worker
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/english_learning}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      PRIMARY_AI_PROVIDER: ${PRIMARY_AI_PROVIDER:-gemini}
      PRIMARY_AI_MODEL: ${PRIMARY_AI_MODEL:-gemini-2.5-flash}
      PRIMARY_AI_API_KEY: ${PRIMARY_AI_API_KEY:-}
      ESCALATION_AI_PROVIDER: ${ESCALATION_AI_PROVIDER:-gemini}
      ESCALATION_AI_MODEL: ${ESCALATION_AI_MODEL:-gemini-2.5-pro}
      ESCALATION_AI_API_KEY: ${ESCALATION_AI_API_KEY:-}
      GENERATION_WORKER_CONCURRENCY: ${GENERATION_WORKER_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Separate process from the API server on purpose: a slow or expensive
    # generation job (an hour-long book import) should never be able to
    # block request handling on the backend service.
    command: npm run worker

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile.dev
    container_name: english_learning_frontend
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:5000}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      - backend
    # Avoid bind-mounting the frontend source to preserve image-built node_modules
    # and Next build artifacts when running under docker-compose.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: english_learning_network
