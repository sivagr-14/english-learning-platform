name: Application build and integration checklist

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: application-checklist-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-pack-contract:
    name: Content-pack contract validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Activate Yarn 1
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile
      - name: Validate committed content packs
        run: yarn content-packs:validate

  base-01-gold-corpus:
    name: BASE-01 gold-corpus validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build deterministic gold corpus
        run: |
          node scripts/baseline/build-gold-corpus.js
          sha256sum test/fixtures/gold-corpus/generated/* > /tmp/base-01-first.sha256
      - name: Validate gold corpus
        run: node scripts/baseline/validate-gold-corpus.js
      - name: Confirm generated fixtures are reproducible
        run: |
          node scripts/baseline/build-gold-corpus.js
          sha256sum test/fixtures/gold-corpus/generated/* > /tmp/base-01-second.sha256
          diff -u /tmp/base-01-first.sha256 /tmp/base-01-second.sha256

  application-checklist:
    name: Application build and integration checklist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: english_learning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d english_learning"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: english_learning
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/english_learning
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: github-actions-content-pack-smoke-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Activate Yarn 1
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile
      - name: Apply database migrations
        run: yarn db:migrate
      - name: Seed reference data
        run: yarn db:seed
      - name: Run backend tests
        run: yarn workspace english-learning-backend test --runInBand
      - name: Run control-server tests
        run: yarn test:control
      - name: Type-check backend and frontend
        run: yarn type-check
      - name: Build backend and frontend
        run: yarn build
      - name: Smoke-test taxonomy migration
        run: yarn smoke:taxonomy-migration
      - name: Smoke-test content-pack import
        run: yarn smoke:content-packs
      - name: Smoke-test vocabulary senses
        run: yarn smoke:vocabulary-senses
      - name: Smoke-test user categories
        run: yarn smoke:user-categories
